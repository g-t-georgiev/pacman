# After every push to main (a release merged from dev), bring dev up to date with main, so
# main never has commits dev lacks (the merge commits of dev → main pull requests). Usually a
# fast-forward; if dev moved on meanwhile, main is merged into dev.
#
# It pushes with the SYNC_TOKEN secret: a fine-grained personal access token for this repository
# with "Contents: Read and write". With dev protected (a ruleset), put "Repository admin" on the
# ruleset's bypass list so your token gets past it, like a release bot. Without the secret it
# uses the workflow's own token, which works only while dev is unprotected.
# Run it by hand too: Actions → Sync dev → Run workflow.
name: Sync dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Bring dev up to main
        env:
          HAS_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          fail() {
            echo "::error::Couldn't push to dev. If dev is protected, save a token as the SYNC_TOKEN secret and put Repository admin on the ruleset's bypass list (see this workflow's header)."
            exit 1
          }
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            if [ "$(git rev-parse origin/dev)" = "$(git rev-parse HEAD)" ]; then
              echo "dev is already main."
            else
              git push origin HEAD:dev || fail
              echo "dev fast-forwarded to main."
            fi
          elif git merge-base --is-ancestor HEAD origin/dev; then
            echo "dev already contains main."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B dev origin/dev
            git merge --no-edit origin/main -m "Merge main into dev (sync after a release)"
            git push origin dev || fail
            echo "main merged into dev."
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Synced with the workflow's own token (no SYNC_TOKEN): this stops working once dev is protected."
          fi
