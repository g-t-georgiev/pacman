# The same checks as the pre-commit hook, plus the full test suite and the build (plan T3).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; nothing may hold CI for hours (the job limit is 6 h)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The whole history and its tags: the release check reads the commits since the last tag
          fetch-depth: 0
      # Installs Vite+, Node.js and the project's package manager (bun), then `vp install`
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      # Format, lint and type check
      - run: vp check
      # The e2e tests run the app in Chromium (Vitest browser mode, plan T5). The browser comes
      # from Playwright's servers and is cached; its system libraries are already on the runner,
      # so the apt step only adds optional fonts. Ubuntu's mirrors are sometimes down (503s, no
      # route): then the apt step gives up after 3 minutes and the tests run with what is there.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Chromium for the e2e tests
        timeout-minutes: 10
        run: |
          vp exec playwright install chromium
          if ! timeout --kill-after=15 180 vp exec playwright install-deps chromium; then
            echo "::warning::Couldn't install Playwright's system packages (Ubuntu's mirrors?); the tests run with what the runner has."
          fi
      # Unit, integration, fidelity, regression and golden replay tests, then the e2e tests
      - run: vp test
      # The golden replays still match this build (versions bumped when the rules change)
      - run: vp run golden:check
      - run: vp build
      # A pull request into main must carry the version its changes need (vp run release on dev)
      - if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: vp run release:check
